<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSM Auto — Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: #0f3460;
            padding: 40px;
            border-radius: 16px;
            width: 360px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
            color: #e94560;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            background: #1a1a2e;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #e94560;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #c23152; }
        button:active { transform: scale(0.98); }
        .error {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 8px;
            border-radius: 6px;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🚛 TSM Auto v3.0</h2>
        <p class="subtitle">Система управления автосервисом</p>
        <div class="error" id="error">Неверный логин или пароль</div>

        <label>Логин</label>
        <input type="text" id="login" placeholder="Введите логин" autocomplete="username" autofocus>

        <label>Пароль</label>
        <input type="password" id="password" placeholder="Введите пароль" autocomplete="current-password">

        <button onclick="doLogin()">Войти</button>
    </div>

    <script>
        async function doLogin() {
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            const error = document.getElementById('error');
            error.classList.remove('show');

            if (!login || !password) {
                error.textContent = 'Заполните все поля';
                error.classList.add('show');
                return;
            }

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                if (resp.ok) {
                    const data = await resp.json();
                    localStorage.setItem('tsm_token', data.token);
                    localStorage.setItem('tsm_user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    const err = await resp.json();
                    error.textContent = err.detail || 'Ошибка входа';
                    error.classList.add('show');
                }
            } catch (e) {
                error.textContent = 'Ошибка соединения с сервером';
                error.classList.add('show');
            }
        }

        // Вход по Enter
        document.getElementById('password').onkeypress = (e) => {
            if (e.key === 'Enter') doLogin();
        };

        // Проверка: если уже залогинен — редирект
        if (localStorage.getItem('tsm_token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
